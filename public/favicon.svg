<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient Fond Nacre Luxueux -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    
    <!-- Gradient Doré 3D Haute Couture -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6" />
      <stop offset="30%" stop-color="#E6C675" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7D2B" />
    </linearGradient>

    <!-- Ombre Portée Subtile -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond Arrondi Style App Icon Deluxe -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Cercles d'Ornementation de Marque -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Logo Icône Ciseaux & Couronne Haute Couture (Golden Scissors & Crown) -->
  <g filter="url(#dropShadow)">
    <!-- 👑 Couronne d'Atelier VIP -->
    <path d="M 196 140 L 220 185 L 256 150 L 292 185 L 316 140 L 328 200 L 184 200 Z" fill="url(#goldGrad)"/>
    <circle cx="196" cy="132" r="7" fill="url(#goldGrad)"/>
    <circle cx="256" cy="140" r="8" fill="url(#goldGrad)"/>
    <circle cx="316" cy="132" r="7" fill="url(#goldGrad)"/>

    <!-- ✂️ Ciseaux Haute Couture Ajustés -->
    <!-- Anneau Gauche -->
    <circle cx="185" cy="365" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    <!-- Anneau Droit -->
    <circle cx="327" cy="365" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>

    <!-- Lame Droite (reliant Anneau Gauche vers haut Droit) -->
    <path d="M 200 335 L 320 215 L 332 227 L 212 347 Z" fill="url(#goldGrad)"/>
    <!-- Lame Gauche (reliant Anneau Droit vers haut Gauche) -->
    <path d="M 312 335 L 192 215 L 180 227 L 300 347 Z" fill="url(#goldGrad)"/>

    <!-- Pivot Central Doré -->
    <circle cx="256" cy="281" r="14" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="4"/>
  </g>
</svg>